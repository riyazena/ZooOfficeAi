  }
  function closeDeleteAccount(){ root.classList.add('hidden'); if(input) input.value=''; sync(); }
  input?.addEventListener('input',sync);

<script>
/* Account/Security controls use event delegation because Settings is rendered dynamically. */
document.addEventListener('click', function(event){
  const photoBtn=event.target.closest('#changeProfilePicture');
  if(photoBtn){
    event.preventDefault();
    const photoInput=document.getElementById('accountPhotoInput');
    if(photoInput) photoInput.click();
    return;
  }

  const removePhotoBtn=event.target.closest('#removeProfilePicture');
  if(removePhotoBtn){
    event.preventDefault();
    const avatar=document.getElementById('accountAvatar');
    const photoInput=document.getElementById('accountPhotoInput');
    if(avatar) avatar.textContent='RY';
    if(photoInput) photoInput.value='';
    accountPhotoData='';
    removePhotoBtn.classList.add('hidden');
    return;
  }

  const usernameBtn=event.target.closest('#changeUsername');
  if(usernameBtn){
    event.preventDefault();
    const display=document.getElementById('accountUsernameDisplay');
    const row=document.getElementById('usernameEditRow');
    const input=document.getElementById('accountUsernameInput');
    if(!row || !input) return;
    input.value=display?.textContent?.trim()||input.value;
    display?.classList.add('hidden');
    row.classList.remove('hidden');
    usernameBtn.classList.add('hidden');
    input.focus(); input.select();
    return;
  }
  const saveUsernameBtn=event.target.closest('#saveUsername');
  if(saveUsernameBtn){
    event.preventDefault();
    const display=document.getElementById('accountUsernameDisplay');
    const row=document.getElementById('usernameEditRow');
    const input=document.getElementById('accountUsernameInput');
    const edit=document.getElementById('changeUsername');
    const value=input?.value.trim();
    if(value && display) display.textContent=value;
    row?.classList.add('hidden'); display?.classList.remove('hidden'); edit?.classList.remove('hidden');
    return;
  }
  const cancelUsernameBtn=event.target.closest('#cancelUsername');
  if(cancelUsernameBtn){
    event.preventDefault();
    const display=document.getElementById('accountUsernameDisplay');
    const row=document.getElementById('usernameEditRow');
    const input=document.getElementById('accountUsernameInput');
    const edit=document.getElementById('changeUsername');
    if(input && display) input.value=display.textContent.trim();
    row?.classList.add('hidden'); display?.classList.remove('hidden'); edit?.classList.remove('hidden');
    return;
  }
  const passwordBtn=event.target.closest('#changePassword');
  if(passwordBtn){
    event.preventDefault();
    const currentPw=document.getElementById('currentPassword');
    const newPw=document.getElementById('newPassword');
    const confirmPw=document.getElementById('confirmPassword');
    if(!currentPw || !newPw || !confirmPw) return;
    if(!currentPw.value || !newPw.value || !confirmPw.value){
      const firstEmpty=[currentPw,newPw,confirmPw].find(i=>!i.value);
      firstEmpty?.focus();
      firstEmpty?.setCustomValidity('Please complete this field');
      firstEmpty?.reportValidity();
      setTimeout(()=>firstEmpty?.setCustomValidity(''),0);
      return;
    }
    if(newPw.value !== confirmPw.value){
      confirmPw.setCustomValidity('Passwords do not match');
      confirmPw.reportValidity();
      confirmPw.focus();
      return;
    }
    confirmPw.setCustomValidity('');
    [currentPw,newPw,confirmPw].forEach(input=>input.value='');
    passwordBtn.classList.add('saved-state');

document.addEventListener('change', function(event){
  const photoInput=event.target.closest('#accountPhotoInput');
  if(!photoInput) return;
  const file=photoInput.files?.[0];
  if(!file) return;
  const avatar=document.getElementById('accountAvatar');
  const reader=new FileReader();
  reader.onload=function(e){
    accountPhotoData=e.target.result;
    if(avatar) avatar.innerHTML='<img src="'+e.target.result+'" alt="Profile picture">';
    document.getElementById('removeProfilePicture')?.classList.remove('hidden');
  };
  reader.readAsDataURL(file);

<script id="help-final-refinement-script">
(function(){
  const iconMap={ZooSlides:'presentation',ZooDocs:'file-text',ZooSheets:'sheet',ZooDesign:'palette',ZooImage:'image',ZooChat:'message-circle',ZooNotes:'notebook-pen'};
  function syncHelpProductBranding(){
    document.querySelectorAll('.help-product-card').forEach(card=>{
      const name=(card.querySelector('strong')?.textContent||'').trim();
      if(!name) return;
      card.dataset.product=name;
      const iconWrap=card.querySelector('.help-product-icon');
      if(iconWrap && iconMap[name]) iconWrap.innerHTML='<i data-lucide="'+iconMap[name]+'"></i>';
    });
    document.querySelectorAll('.help-offer-row').forEach(row=>{
      const name=(row.querySelector('strong')?.textContent||'').trim();
      if(!name) return;
      row.dataset.product=name;
      const iconWrap=row.querySelector(':scope > span');
      if(iconWrap && iconMap[name]) iconWrap.innerHTML='<i data-lucide="'+iconMap[name]+'"></i>';
    });
    if(window.lucide) lucide.createIcons({attrs:{'aria-hidden':'true'}});
  }
  document.addEventListener('DOMContentLoaded',syncHelpProductBranding);
  document.addEventListener('click',()=>setTimeout(syncHelpProductBranding,0));

<script id="report-bug-popup-script">
function openReportBugModal(){
  document.querySelector('.report-bug-scrim')?.remove();
  document.querySelector('.report-bug-modal')?.remove();
  const scrim=document.createElement('button');
  scrim.type='button'; scrim.className='report-bug-scrim'; scrim.setAttribute('aria-label','Close report bug dialog');
  const modal=document.createElement('section');

  const close=()=>{scrim.remove();modal.remove()};
  scrim.addEventListener('click',close); modal.querySelector('.report-bug-close').addEventListener('click',close); modal.querySelector('.report-bug-cancel').addEventListener('click',close);

}

<script id="zooslides-guide-page-script">
(function(){
const productIconMap={ZooSlides:'presentation',ZooDocs:'file-text',ZooSheets:'sheet',ZooDesign:'palette',ZooChat:'message-circle',ZooNotes:'notebook-pen',ZooImage:'image',ZooDrive:'folder'};
function productSidebar(active='ZooSlides'){
 const helpItems=[['help-center','circle-help','Help Center'],['about','user-round','About Us'],['terms','file-text','Terms of Service'],['privacy','shield-check','Privacy Policy']];
 const items=[['ZooSlides','presentation'],['ZooDocs','file-text'],['ZooSheets','sheet'],['ZooDesign','palette'],['ZooChat','message-circle'],['ZooNotes','notebook-pen'],['ZooImage','image'],['ZooDrive','folder']];
 return `<aside class="product-guide-sidebar">
   <div class="product-guide-label">Help & resources</div>
   <div class="product-guide-helpnav">${helpItems.map(([id,icon,label])=>`<button type="button" data-help-page="${id}"><i data-lucide="${icon}"></i>${label}</button>`).join('')}</div>
   <div class="product-guide-divider"></div>
   <div class="product-guide-label">Product features</div>
  <div class="product-guide-nav">${items.map(([n,i])=>`<button type="button" class="${n===active?'active':''}" data-product-guide="${n}" data-product="${n}"><span class="product-guide-product-icon">${n==='ZooDrive'?'<img class="zoodrive-brand-icon" src="Zoo_Office_ZooDrive-01.png" alt="">':`<i data-lucide="${i}"></i>`}</span>${n}</button>`).join('')}</div>
   <div class="product-guide-divider"></div>
   <div class="product-guide-label">On this page</div>
   <div class="product-guide-onpage"><a href="#pg-what">What is ZooSlides?</a><a href="#pg-quick">Quick Start</a><a href="#pg-features">Feature Guide</a><a href="#pg-tips">Pro tips</a></div>
   <div class="product-guide-divider"></div>
   <div class="product-guide-support"><strong>Need more help?</strong><p>Contact support if you cannot find the answer you need.</p><button type="button" data-report-bug>Contact support</button></div>
 </aside>`
}
function zooSlidesMarkup(){return `<div class="product-guide-layout">${productSidebar('ZooSlides')}<section class="product-guide-content"><div class="product-guide-inner">
<section class="pg-hero"><div><div class="pg-hero-icon"><i data-lucide="presentation"></i></div><span class="pg-badge">PRODUCT GUIDE</span><h1>ZooSlides</h1><p>Turn a short prompt into a polished presentation. Describe your topic, choose a template, review the outline, and export a ready-to-share PowerPoint deck.</p><button class="pg-primary" type="button">Try now →</button></div></section>
<section class="pg-section" id="pg-what"><h2>What is ZooSlides?</h2><p>ZooSlides is ZooOffice's presentation builder. It uses AI to plan slide structure, write concise slide copy, and apply visual templates so you spend less time formatting and more time presenting.</p><div class="pg-feature-list">
${[['zap','Instant professional presentations','Get a complete deck in minutes from a single prompt, including outline, copy, and layout.'],['layout-template','Template-driven design','Browse themed templates or upload your own PPTX so every slide stays on brand.'],['list-tree','Outline before you build','Review and adjust structure before slides render, or skip the outline for a fast one-pass deck.'],['paperclip','Attach source material','Upload notes, CSV, PDF, or Word files so ZooSlides writes from your data and documents.'],['download','Export to PowerPoint','Download a standard PPTX file for PowerPoint, Google Slides, or Keynote.']].map(([i,t,d])=>`<div class="pg-feature"><span class="pg-feature-icon"><i data-lucide="${i}"></i></span><div><strong>${t}</strong><small>${d}</small></div></div>`).join('')}
</div></section>
<section class="pg-section" id="pg-quick"><h2>Quick Start</h2><p>Get started in four simple steps:</p><div class="pg-steps">${[['Open ZooSlides and enter your topic','From the home hub or sidebar, open ZooSlides. Type what your presentation is about.'],['Choose a template (optional)','Scroll the template gallery and pick a style that matches your audience, or upload your own PPTX.'],['Generate and review the outline','Zoo proposes an outline first so you can adjust sections before slides are built.'],['Preview and download','When generation finishes, preview slides, rename the deck if needed, and download the PPTX file.']].map((x,i)=>`<div class="pg-step"><span class="pg-step-num">${i+1}</span><strong>${x[0]}</strong><p>${x[1]}</p></div>`).join('')}</div></section>
<section class="pg-section" id="pg-features"><h2>Feature Guide</h2><div class="pg-accordion"><div class="pg-acc-item open"><button class="pg-acc-btn" type="button">Templates & My Templates <i data-lucide="chevron-down"></i></button><div class="pg-acc-panel">Explore filters for style, theme, and popularity. Select a template before generating to keep colors and layout consistent across every slide.<div class="pg-template-demo"><div class="pg-template-box"><div><strong>My Templates</strong><small>+ Add My Template</small></div></div><span class="pg-template-arrow">→</span><div class="pg-template-box"><div><strong>Upload PPTX file</strong><small>Max 50MB, 20 slides</small></div></div><span class="pg-template-arrow">→</span><div class="pg-template-box"><div><strong>Confirm and import</strong><small>Review thumbnails first</small></div></div></div></div></div>
${[['Attach files & data','Add source documents before generation so the deck can use your own facts, notes, and data.'],['Outline review','Edit, reorder, add, or remove sections before ZooSlides generates the final presentation.'],['Live preview & AI edit','Review slides as they are generated and use AI to rewrite or refine individual slides.'],['Export PPTX','Export the completed deck as a standard PowerPoint file.']].map(([t,d])=>`<div class="pg-acc-item"><button class="pg-acc-btn" type="button">${t}<i data-lucide="chevron-down"></i></button><div class="pg-acc-panel">${d}</div></div>`).join('')}</div></section>
<section class="pg-section" id="pg-tips"><h2>Pro tips</h2><div class="pg-tips">${[['sparkles','Plan for clean, balanced layouts','Ask for one main idea per slide and 3–5 bullets max. Shorter prompts with a clear audience and goal produce decks that need fewer edits.'],['text','Name the outcome you want','Phrases like “board update,” “sales pitch,” or “training deck” help Zoo pick tone, depth, and slide count automatically.'],['upload','Reuse templates for brand consistency','Upload a company PPTX once, then generate every new deck against that template so fonts and colors stay on brand.']].map(([i,t,d])=>`<div class="pg-tip"><span class="pg-feature-icon"><i data-lucide="${i}"></i></span><strong>${t}</strong><p>${d}</p></div>`).join('')}</div></section>
</div></section></div>`}
window.openZooSlidesGuide=function(){
 document.body.classList.add('help-fullscreen');
 const main=document.querySelector('#main'); if(!main) return;
 main.className='main help-page';
 main.innerHTML=`<div class="help-app"><header class="help-app-topbar"><div class="help-app-title"><img class="help-zoo-office-logo" src="Zoo_Office_Logo_Horizontal_Blue.png" alt="Zoo Office"></div><div class="help-app-actions"><label class="help-top-search"><i data-lucide="search"></i><input type="search" placeholder="Search help" aria-label="Search help"></label><button class="help-back" type="button" id="helpBack"><i data-lucide="arrow-left"></i>Back to workspace</button></div></header>${zooSlidesMarkup()}</div>`;
 main.querySelector('#helpBack')?.addEventListener('click',showNewChat);
 main.querySelectorAll('.pg-acc-btn').forEach(b=>b.addEventListener('click',()=>b.closest('.pg-acc-item').classList.toggle('open')));
 main.querySelectorAll('[data-report-bug]').forEach(b=>b.addEventListener('click',openReportBugModal));
 main.querySelectorAll('[data-help-page]').forEach(b=>b.addEventListener('click',()=>openHelpPage(b.dataset.helpPage)));
 main.querySelectorAll('[data-product-guide]').forEach(b=>b.addEventListener('click',()=>{ if(b.dataset.productGuide==='ZooSlides') openZooSlidesGuide(); }));
 if(window.lucide) lucide.createIcons({attrs:{'aria-hidden':'true'}}); window.scrollTo(0,0);
}
document.addEventListener('click',function(e){
 const card=e.target.closest('.help-product-card'); if(!card) return;
 const name=(card.querySelector('strong')?.textContent||'').trim();
 if(name==='ZooSlides'){e.preventDefault();e.stopPropagation();openZooSlidesGuide();}
},true);
})();
</script>

<script id="font-size-floor">
(() => {
  const applyFloor = (root) => {
    const elements = root.nodeType === 1 ? [root, ...root.querySelectorAll('*')] : [...root.querySelectorAll('*')];
    for (const element of elements) {
      if (element.closest('svg') || /^(SCRIPT|STYLE|LINK|META)$/.test(element.tagName)) continue;
      const size = parseFloat(getComputedStyle(element).fontSize);
      if (size > 0 && size < 12) element.style.setProperty('font-size', '12px', 'important');
    }
  };
  applyFloor(document);
  new MutationObserver(records => {
    for (const record of records) {
      if (record.type === 'childList') record.addedNodes.forEach(node => { if (node.nodeType === 1) applyFloor(node); });
      else if (record.target.nodeType === 1) applyFloor(record.target);
    }
  }).observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'style'] });
})();
</script>

<script id="composer-attachment-menu-script">
(() => {
  let activeMenu = null;
  const setButtonState = (button, open) => {
    if (!button) return;
    button.classList.toggle('is-open', open);
    button.setAttribute('aria-expanded', String(open));
    button.setAttribute('aria-label', open ? 'Close attachments' : 'Add context');
    button.innerHTML = `<i data-lucide="${open ? 'x' : 'plus'}"></i>`;
    window.lucide?.createIcons?.();
  };
  const closeMenus = () => {
    document.querySelectorAll('.attachment-menu').forEach(menu => {
      const composer = menu.closest('.home-composer');
      menu.remove();
      setButtonState(composer?.querySelector('.composer-plus'), false);
    });
    activeMenu = null;
  };
  const renderOptions = menu => {
    menu.innerHTML = '<button type="button" role="menuitem" data-attachment="computer"><i data-lucide="paperclip"></i><span>Upload files</span></button><button type="button" role="menuitem" data-attachment="zoodrive"><i data-lucide="cloud"></i><span>Add from ZooDrive</span></button>';
    window.lucide?.createIcons?.();
  };
  document.addEventListener('click', event => {
    const plus = event.target.closest('.home-composer .composer-plus');
    if (plus) {
      event.preventDefault(); event.stopPropagation();
      const composer = plus.closest('.home-composer');
      const existing = composer.querySelector('.attachment-menu');
      if (existing) { closeMenus(); return; }
      closeMenus();
      const menu = document.createElement('div');
      menu.className = 'attachment-menu'; menu.setAttribute('role','menu');
      renderOptions(menu); composer.append(menu); activeMenu = menu;
      setButtonState(plus,true);
      return;
    }
    const option = event.target.closest('.attachment-menu [data-attachment]');
    if (option) {
      event.preventDefault(); event.stopPropagation();
      const menu = option.closest('.attachment-menu');
      if (option.dataset.attachment === 'computer') {
        const composer = menu.closest('.home-composer');
        const picker = document.createElement('input');
        picker.type = 'file'; picker.hidden = true; picker.multiple = true;
        const finish = () => {
          const names = [...picker.files].map(file => file.name);
          if (names.length) {
            const textarea = composer.querySelector('textarea');
            if (textarea) { textarea.dataset.attachedFiles = names.join(', '); textarea.placeholder = names.join(', '); }
          }
          picker.remove();
        };
        picker.addEventListener('change', finish, {once:true});
        picker.addEventListener('cancel', finish, {once:true});
        document.body.append(picker); closeMenus(); picker.click();
      } else if (option.dataset.attachment === 'zoodrive') {
        menu.innerHTML = '<div class="attachment-menu-heading">ZooDrive</div><p class="attachment-note">Choose a file from your ZooDrive to attach it to this chat.</p><button type="button" role="menuitem" data-attachment="back"><i data-lucide="arrow-left"></i><span>Back to upload options</span></button>';
        window.lucide?.createIcons?.();
      } else if (option.dataset.attachment === 'more') {
        menu.innerHTML = '<div class="attachment-submenu"><button type="button" role="menuitem" data-attachment="link"><i data-lucide="link"></i><span>Upload from link</span></button><button type="button" role="menuitem" data-attachment="paste"><i data-lucide="clipboard"></i><span>Paste text</span></button><div class="attachment-menu-divider"></div><button type="button" role="menuitem" data-attachment="back"><i data-lucide="arrow-left"></i><span>Back to uploads</span></button></div>';
        window.lucide?.createIcons?.();
      } else if (option.dataset.attachment === 'back') {
        renderOptions(menu);
      } else if (option.dataset.attachment === 'link' || option.dataset.attachment === 'paste') {
        menu.innerHTML = `<p class="attachment-note">${option.dataset.attachment === 'link' ? 'Paste a file link in your prompt to attach it.' : 'Paste text into your prompt to include it with your message.'}</p><button type="button" role="menuitem" data-attachment="back"><i data-lucide="arrow-left"></i><span>Back to uploads</span></button>`;
        window.lucide?.createIcons?.();
      }
      return;
    }
    if (activeMenu && !event.target.closest('.attachment-menu')) closeMenus();
  });
})();
</script>

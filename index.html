  <script>
    const tools=[['Ask Zena','Think, research, and write','sparkles','blue'],['Document','Draft from a prompt or template','file-text','violet'],['Presentation','Build a polished slide deck','presentation','orange'],['Spreadsheet','Analyze and organize data','sheet','green'],['Image','Generate and edit visuals','image','pink'],['Meeting note','Capture or import a meeting','mic','teal']];
    const apps=[['ZooSlides','Smart presentations made simple','presentation','orange'],['ZooSheets','Smart spreadsheets with AI','sheet','green'],['ZooDocs','Collaborative docs that flow','file-text','blue'],['ZooDesign','Create stunning designs with AI','palette','violet'],['ZooImage','Generate images with AI','image','pink'],['ZooChat','Chat with AI, get answers','message-circle','blue'],['ZooNotes','Smart notes for better meetings','notebook-pen','teal']];
    const recents=[['Q3 launch strategy','Slides','Edited 18 min ago','RY + 3','presentation','orange'],['Retail forecast model','Sheets','Edited yesterday','RY','sheet','green'],['Partner kickoff notes','Notes','Edited yesterday','RY + 5','mic','teal'],['Campaign concept board','Image','Edited Aug 28','RY + 1','image','pink']];
    const conversations=['Design a minimal bakery loyalty card','Create a summer festival poster','Build a mobile app onboarding concept','Make a conference badge system','Design packaging for herbal tea','Create a quarterly planning deck','Turn research notes into five slides','Build an investor update presentation','Create a workshop training deck','Summarize our launch plan as slides','Forecast monthly subscription revenue','Create a household expense tracker','Compare regional sales performance','Build an inventory reorder sheet','Calculate project staffing costs','Draft a friendly client proposal','Write an employee onboarding guide','Create a product requirements document','Rewrite this policy in plain language','Draft a partnership announcement','Generate a surreal underwater library','Create a studio product photograph','Make an editorial travel illustration','Generate icons for a weather app','Create a cozy reading-room scene','Brainstorm names for a meal-planning app','Explain carbon credits simply','Plan a three-day team retreat','Compare two customer support strategies','Suggest interview questions for a designer','Summarize the weekly product meeting','Turn this transcript into action items','Create notes for a project kickoff','Organize usability-test observations','Draft follow-ups from the budget review','Create a decision log for the launch'];
    const $=s=>document.querySelector(s), root=document.documentElement, sidebar=$('#sidebar'), newChatMarkup=$('#main').innerHTML;
    function icons(){if(window.lucide)lucide.createIcons({attrs:{'aria-hidden':'true'}})}
    function start(name){$('#modalRoot').innerHTML='';$('#toastRoot').innerHTML=`<div class="toast" role="status"><i data-lucide="check"></i>${name} workspace opened</div>`;icons();setTimeout(()=>$('#toastRoot').innerHTML='',2400)}
    function renderHistory(q=''){const rows=conversations.filter(x=>x.toLowerCase().includes(q.toLowerCase()));$('#sidebarHistory').innerHTML=rows.map(x=>`<button class="history-link" title="${x}" data-name="${x}">${x}</button>`).join('');document.querySelectorAll('.history-link').forEach(b=>b.onclick=()=>start(b.dataset.name))}
    function showNewChat(){
      $('#main').className='main chat-page';$('#main').innerHTML=newChatMarkup;$('#searchHistory').classList.remove('active');renderTools();icons()
    }
    function showSearchPage(){
      $('#searchHistory').classList.add('active');$('#main').className='main';
      $('#main').innerHTML=`<section class="search-page"><h1>Search chats</h1><label class="search-page-input"><i data-lucide="search"></i><span class="sr-only">Search chats</span><input id="chatSearchInput" type="search" placeholder="Search chats" autocomplete="off"></label><p class="search-results-title">Recent</p><div class="search-results" id="chatSearchResults"></div></section>`;
      const dates=['Today','Today','Yesterday','Yesterday','Aug 28','Aug 27','Aug 25','Aug 22','Aug 20','Aug 18','Aug 14','Aug 10'];
      const draw=q=>{const rows=conversations.filter(x=>x.toLowerCase().includes(q.toLowerCase()));$('#chatSearchResults').innerHTML=rows.length?rows.map((x,i)=>`<button class="search-result" data-name="${x}"><strong>${x}</strong><time>${dates[i%dates.length]}</time></button>`).join(''):'<div class="search-empty">No chats match your search.</div>';document.querySelectorAll('.search-result').forEach(b=>b.onclick=()=>start(b.dataset.name))};
      draw('');$('#chatSearchInput').oninput=e=>draw(e.target.value);icons();$('#chatSearchInput').focus()
    }
    function renderTools(){
      const home=$('#homeApps');
      if(home){
        const groups=[
          ['Office Suite',[apps[2],apps[1],apps[0]],3],
          ['Design & Create',[apps[3],apps[4]],2],
          ['AI & Productivity',[apps[5],apps[6]],2]
        ];
        const card=a=>`<div class="launch-wrap"><button class="launch-card action" data-name="${a[0]}"><span class="tool-icon ${a[3]}"><i data-lucide="${a[2]}"></i></span><strong>${a[0]}</strong><small>${a[1]}</small></button></div>`;
        home.innerHTML=groups.map(g=>`<section class="app-group"><h2 class="app-group-title">${g[0]}</h2><div class="app-group-grid" style="--cols:${g[2]}">${g[1].map(card).join('')}</div></section>`).join('');
      }
      document.querySelectorAll('.action').forEach(b=>b.onclick=()=>start(b.dataset.name));icons()
    }
    function renderRecents(q=''){const rows=recents.filter(r=>r[0].toLowerCase().includes(q.toLowerCase()));$('#recentTable').innerHTML=rows.length?rows.map(r=>`<button class="recent-row action" data-name="${r[0]}"><span class="file-icon ${r[5]}"><i data-lucide="${r[4]}"></i></span><span class="recent-name"><strong>${r[0]}</strong><small>${r[1]}</small></span><span class="recent-people">${r[3]}</span><span class="recent-time">${r[2]}</span><i data-lucide="more-horizontal"></i></button>`).join(''):'<div class="empty"><b>No matching work</b><p>Try a different search.</p></div>';document.querySelectorAll('.recent-row').forEach(b=>b.onclick=()=>start(b.dataset.name));icons()}
    function openCreate(){
      const option=t=>`<button class="create-option" data-name="${t[0]}"><span class="tool-icon ${t[3]}"><i data-lucide="${t[2]}"></i></span><span><strong>${t[0]}</strong><small>${t[1]}</small></span><i data-lucide="chevron-right"></i></button>`;
      const groups=[['Office suite',tools.slice(1,4)],['Design & create',[tools[4]]],['Content creation',[tools[0]]],['Tools',[tools[5]]]];
      const content=groups.map(g=>`<section class="create-group"><h3 class="create-group-title">${g[0]}</h3><div class="create-group-list">${g[1].map(option).join('')}</div></section>`).join('');
      const drawerLeft=window.matchMedia('(max-width:620px)').matches?12:Math.max(0,sidebar.getBoundingClientRect().right);
      $('#create').classList.add('open-state');
      $('#modalRoot').innerHTML=`<button class="scrim" aria-label="Close create panel"></button><aside class="modal create-drawer" style="left:${drawerLeft}px" role="dialog" aria-modal="true" aria-labelledby="createTitle"><div class="modal-head"><div><p class="eyebrow">Create new</p><h2 id="createTitle">Choose what to create</h2><p>Open the right Zena tool directly.</p></div><button class="icon close-modal" aria-label="Close"><i data-lucide="x"></i></button></div>${content}</aside>`;
      const close=()=>{$('#modalRoot').innerHTML='';$('#create').classList.remove('open-state')};
      $('.scrim').onclick=$('.close-modal').onclick=close;
      document.querySelectorAll('.create-option').forEach(b=>b.onclick=()=>{close();start(b.dataset.name)});icons()
    }
    function openZenaTools(){
      const option=a=>`<button class="create-option" data-name="${a[0]}"><span class="tool-icon ${a[3]}"><i data-lucide="${a[2]}"></i></span><span><strong>${a[0]}</strong><small>${a[1]}</small></span><i data-lucide="chevron-right"></i></button>`;
      const mainApps=apps.slice(0,6), notes=apps[6];
      $('#zenaApps').classList.add('drawer-open');
      $('#modalRoot').innerHTML=`<button class="scrim" aria-label="Close ZenaTools"></button><section class="modal apps-modal" role="dialog" aria-modal="true" aria-labelledby="appsTitle"><div class="modal-head apps-modal-head"><div class="apps-title-copy"><h2 id="appsTitle">ZenaTools</h2><p>Choose a tool or explore more products.</p></div><button class="apps-close close-modal" aria-label="Close"><i data-lucide="x"></i></button></div><div class="apps-grid">${mainApps.map(option).join('')}<div class="apps-bottom-row">${option(notes)}<div class="marketplace-card"><span class="marketplace-logo" aria-hidden="true"><i data-lucide="store"></i></span><span class="marketplace-copy"><strong>Marketplace</strong><small>Discover more Zoo Office products</small></span><button class="marketplace-button" id="openMarketplace">Open</button></div></div></div></section>`;
      const close=()=>{$('#modalRoot').innerHTML='';$('#zenaApps').classList.remove('drawer-open')};
      $('.scrim').onclick=$('.close-modal').onclick=close;
      document.querySelectorAll('.create-option').forEach(b=>b.onclick=()=>{close();start(b.dataset.name)});
      $('#openMarketplace').onclick=e=>{e.stopPropagation();close();start('Marketplace')};
      icons()
    }
    $('#collapse').onclick=()=>{sidebar.classList.add('collapsed');icons()};$('#brandButton').onclick=()=>{if(sidebar.classList.contains('collapsed'))sidebar.classList.remove('collapsed');else showNewChat()};$('#create').onclick=showNewChat;$('#theme').onclick=()=>{const dark=root.dataset.theme!=='dark';root.dataset.theme=dark?'dark':'light';$('#theme').innerHTML=`<i data-lucide="${dark?'sun':'moon'}"></i><span>${dark?'Light':'Dark'} mode</span>`;icons()};$('#searchHistory').onclick=showSearchPage;$('#zenaApps').onclick=openZenaTools;$('#openNav').onclick=()=>sidebar.classList.add('open');$('#closeNav').onclick=()=>sidebar.classList.remove('open');document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='n'&&!/input|textarea/i.test(e.target.tagName)){e.preventDefault();showNewChat()}if(e.key==='Escape'){$('#modalRoot').innerHTML='';$('#zenaApps').classList.remove('drawer-open');sidebar.classList.remove('open')}});renderHistory();renderTools();icons();
  </script>
</body>
</html>

    const tools=[['Ask Zena','Think, research, and write','sparkles','blue'],['Document','Draft from a prompt or template','file-text','violet'],['Presentation','Build a polished slide deck','presentation','orange'],['Spreadsheet','Analyze and organize data','sheet','green'],['Image','Generate and edit visuals','image','pink'],['Meeting note','Capture or import a meeting','mic','teal']];
    const apps=[['ZooSlides','Smart presentations made simple','presentation','orange'],['ZooSheets','Smart spreadsheets with AI','sheet','green'],['ZooDocs','Collaborative docs that flow','file-text','blue'],['ZooDesign','Create stunning designs with AI','palette','violet'],['ZooImage','Generate images with AI','image','pink'],['ZooChat','Chat with AI, get answers','message-circle','blue'],['ZooNotes','Smart notes for better meetings','notebook-pen','teal']];
    const recents=[['Q3 launch strategy','Slides','Edited 18 min ago','RY + 3','presentation','orange'],['Retail forecast model','Sheets','Edited yesterday','RY','sheet','green'],['Partner kickoff notes','Notes','Edited yesterday','RY + 5','mic','teal'],['Campaign concept board','Image','Edited Aug 28','RY + 1','image','pink']];
    const conversations=['Design a minimal bakery loyalty card','Create a summer festival poster','Build a mobile app onboarding concept','Make a conference badge system','Design packaging for herbal tea','Create a quarterly planning deck','Turn research notes into five slides','Build an investor update presentation','Create a workshop training deck','Summarize our launch plan as slides','Forecast monthly subscription revenue','Create a household expense tracker','Compare regional sales performance','Build an inventory reorder sheet','Calculate project staffing costs','Draft a friendly client proposal','Write an employee onboarding guide','Create a product requirements document','Rewrite this policy in plain language','Draft a partnership announcement','Generate a surreal underwater library','Create a studio product photograph','Make an editorial travel illustration','Generate icons for a weather app','Create a cozy reading-room scene','Brainstorm names for a meal-planning app','Explain carbon credits simply','Plan a three-day team retreat','Compare two customer support strategies','Suggest interview questions for a designer','Summarize the weekly product meeting','Turn this transcript into action items','Create notes for a project kickoff','Organize usability-test observations','Draft follow-ups from the budget review','Create a decision log for the launch'];
    const $=s=>document.querySelector(s), root=document.documentElement, sidebar=$('#sidebar'), newChatMarkup=$('#main').innerHTML;
    function icons(){if(window.lucide)lucide.createIcons({attrs:{'aria-hidden':'true'}})}
    function start(name){$('#modalRoot').innerHTML='';$('#toastRoot').innerHTML=`<div class="toast" role="status"><i data-lucide="check"></i>${name} workspace opened</div>`;icons();setTimeout(()=>$('#toastRoot').innerHTML='',2400)}
    const bookmarkedRecents=new Set();
    let bookmarksOnly=false;
    function renderHistory(q=''){
      let rows=conversations.filter(x=>x.toLowerCase().includes(q.toLowerCase()));
      if(bookmarksOnly) rows=rows.filter(x=>bookmarkedRecents.has(x));
      $('#sidebarHistory').innerHTML=rows.length ? rows.map((x,i)=>`
        <div class="history-row ${bookmarkedRecents.has(x)?'is-bookmarked':''}" data-name="${x}">
          <button class="history-link" title="${x}" data-name="${x}">${x}</button>
          ${bookmarkedRecents.has(x)?'<i class="history-bookmark-mark" data-lucide="bookmark"></i>':''}
          <button class="history-more" aria-label="More options for ${x}" data-index="${i}">
            <i data-lucide="ellipsis"></i>
          </button>
        </div>`).join('') : '<div class="history-bookmark-empty">No bookmarked prompts</div>';
      document.querySelectorAll('.history-link').forEach(b=>b.onclick=()=>start(b.dataset.name));
      document.querySelectorAll('.history-more').forEach(b=>b.onclick=e=>{
        e.stopPropagation();
        openHistoryMenu(b, b.closest('.history-row').dataset.name);
      });
      icons()
    }

    function closeHistoryMenu(){
      const menu=document.querySelector('.history-context-menu');
      if(menu)menu.remove();
    }
    function openHistoryMenu(anchor,name){
      closeHistoryMenu();
      const r=anchor.getBoundingClientRect();
      const menu=document.createElement('div');
      menu.className='history-context-menu';
      menu.innerHTML=`
        <button data-action="pin"><i data-lucide="pin"></i><span>Pin</span></button>
        <button data-action="bookmark"><i data-lucide="bookmark"></i><span>Bookmark</span></button>
        <button data-action="rename"><i data-lucide="pencil"></i><span>Rename</span></button>
        <div class="history-menu-divider"></div>
        <button class="danger" data-action="delete"><i data-lucide="trash-2"></i><span>Delete</span></button>`;
      document.body.appendChild(menu);
      const mw=196;
      /* Start the popup exactly at the left edge of the More button */
      let left=r.left;
      left=Math.max(12,Math.min(left,window.innerWidth-mw-12));
      let top=r.bottom+4;
      if(top+menu.offsetHeight>window.innerHeight-12)top=r.top-menu.offsetHeight-6;
      menu.style.left=left+'px';
      menu.style.top=top+'px';
      menu.querySelectorAll('button').forEach(btn=>btn.onclick=e=>{
        e.stopPropagation();
        const action=btn.dataset.action;
        closeHistoryMenu();
        if(action==='bookmark'){
          if(bookmarkedRecents.has(name)) bookmarkedRecents.delete(name);
          else bookmarkedRecents.add(name);
          renderHistory();
          const filter=$('#bookmarkFilter');
          if(filter){
            filter.classList.toggle('active',bookmarksOnly);
            filter.setAttribute('aria-pressed',String(bookmarksOnly));
          }
        }else if(action==='rename'){
          const next=prompt('Rename chat',name);
          if(next&&next.trim()) start('Renamed to '+next.trim());
        }else{
          start(action.charAt(0).toUpperCase()+action.slice(1)+' '+name);
        }
      });

      const manageBtn=$('.account-manage-btn');
      if(manageBtn){
        manageBtn.onclick=()=>{
          const fields=[...document.querySelectorAll('.account-edit-input')];
          const enable=fields.every(f=>f.disabled);
          fields.forEach(f=>f.disabled=!enable);
          manageBtn.textContent=enable?'Done':'Manage';
          manageBtn.classList.toggle('is-editing', enable);
          if(enable && fields[0])fields[0].focus();
        };
      }


      const billingManage=$('.billing-manage-btn');
      if(billingManage){
        billingManage.onclick=()=>{
          $('#modalRoot').innerHTML='';
          openUpgradePlan();
        };
      }

      const usageUpgrade=$('.usage-upgrade-btn');
      if(usageUpgrade){
        usageUpgrade.onclick=()=>{
          $('#modalRoot').innerHTML='';
          openUpgradePlan();
        };
      }

      const saveBtn=$('.settings-save-btn');
      if(saveBtn){
        saveBtn.onclick=()=>{
          const original=saveBtn.textContent;
          saveBtn.textContent='Saved';
          setTimeout(()=>saveBtn.textContent=original,1200);
        };
      }

      icons();
    }
    document.addEventListener('click',e=>{
      if(!e.target.closest('.history-context-menu')&&!e.target.closest('.history-more'))closeHistoryMenu();
    });

    function showNewChat(){ $('#create').classList.add('home-active');
      $('#main').className='main chat-page';$('#main').innerHTML=newChatMarkup;$('#searchHistory').classList.remove('active');renderTools();icons()
    }
    function showSearchPage(){ $('#create').classList.remove('home-active');
      $('#searchHistory').classList.add('active');$('#main').className='main';
      $('#main').innerHTML=`<section class="search-page"><h1>Search recents</h1><label class="search-page-input"><i data-lucide="search"></i><span class="sr-only">Search chats</span><input id="chatSearchInput" type="search" placeholder="Search chats" autocomplete="off"></label><div class="search-page-tabs" role="tablist" aria-label="History filters"><button class="search-page-tab active" data-search-tab="recents" role="tab" aria-selected="true">Recents</button><button class="search-page-tab" data-search-tab="bookmarks" role="tab" aria-selected="false">Bookmarks</button></div><div class="search-results" id="chatSearchResults"></div></section>`;
      const dates=['Today','Today','Yesterday','Yesterday','Aug 28','Aug 27','Aug 25','Aug 22','Aug 20','Aug 18','Aug 14','Aug 10'];
      let searchTab='recents';
      const draw=q=>{
        let rows=conversations.filter(x=>x.toLowerCase().includes(q.toLowerCase()));
        if(searchTab==='bookmarks')rows=rows.filter(x=>bookmarkedRecents.has(x));
        $('#chatSearchResults').innerHTML=rows.length?rows.map((x,i)=>`<button class="search-result" data-name="${x}"><strong>${x}</strong>${bookmarkedRecents.has(x)?'<i class="search-result-bookmark" data-lucide="bookmark"></i>':''}<time>${dates[i%dates.length]}</time></button>`).join(''):`<div class="search-empty">${searchTab==='bookmarks'?'No bookmarked prompts.':'No chats match your search.'}</div>`;
        document.querySelectorAll('.search-result').forEach(b=>b.onclick=()=>start(b.dataset.name));
        icons();
      };
      document.querySelectorAll('.search-page-tab').forEach(tab=>tab.onclick=()=>{
        searchTab=tab.dataset.searchTab;
        document.querySelectorAll('.search-page-tab').forEach(t=>{
          const active=t===tab;t.classList.toggle('active',active);t.setAttribute('aria-selected',String(active));
        });
        draw($('#chatSearchInput').value);
      });
      draw('');$('#chatSearchInput').oninput=e=>draw(e.target.value);icons();$('#chatSearchInput').focus()
    }
    function renderTools(){
      const home=$('#homeApps');
      if(home){
        const groups=[
          ['Office Suite',[apps[2],apps[1],apps[0]],3],
          ['Design & Create',[apps[3],apps[4]],2],
          ['AI & Productivity',[apps[5],apps[6]],2]
        ];
        const card=a=>`<div class="launch-wrap"><button class="launch-card action" data-name="${a[0]}"><span class="tool-icon ${a[3]}"><i data-lucide="${a[2]}"></i></span><strong>${a[0]}</strong><small>${a[1]}</small></button></div>`;
        home.innerHTML=groups.map(g=>`<section class="app-group"><h2 class="app-group-title">${g[0]}</h2><div class="app-group-grid" style="--cols:${g[2]}">${g[1].map(card).join('')}</div></section>`).join('');
      }
      document.querySelectorAll('.action').forEach(b=>b.onclick=()=>start(b.dataset.name));icons()
    }
    function renderRecents(q=''){const rows=recents.filter(r=>r[0].toLowerCase().includes(q.toLowerCase()));$('#recentTable').innerHTML=rows.length?rows.map(r=>`<button class="recent-row action" data-name="${r[0]}"><span class="file-icon ${r[5]}"><i data-lucide="${r[4]}"></i></span><span class="recent-name"><strong>${r[0]}</strong><small>${r[1]}</small></span><span class="recent-people">${r[3]}</span><span class="recent-time">${r[2]}</span><i data-lucide="more-horizontal"></i></button>`).join(''):'<div class="empty"><b>No matching work</b><p>Try a different search.</p></div>';document.querySelectorAll('.recent-row').forEach(b=>b.onclick=()=>start(b.dataset.name));icons()}
    function openCreate(){
      const option=t=>`<button class="create-option" data-name="${t[0]}"><span class="tool-icon ${t[3]}"><i data-lucide="${t[2]}"></i></span><span><strong>${t[0]}</strong><small>${t[1]}</small></span></button>`;
      const groups=[['Office suite',tools.slice(1,4)],['Design & create',[tools[4]]],['Content creation',[tools[0]]],['Tools',[tools[5]]]];
      const content=groups.map(g=>`<section class="create-group"><h3 class="create-group-title">${g[0]}</h3><div class="create-group-list">${g[1].map(option).join('')}</div></section>`).join('');
      const drawerLeft=window.matchMedia('(max-width:620px)').matches?12:Math.max(0,sidebar.getBoundingClientRect().right);
      $('#create').classList.add('open-state');
      $('#modalRoot').innerHTML=`<button class="scrim" aria-label="Close create panel"></button><aside class="modal create-drawer" style="left:${drawerLeft}px" role="dialog" aria-modal="true" aria-labelledby="createTitle"><div class="modal-head"><div><p class="eyebrow">Create new</p><h2 id="createTitle">Choose what to create</h2><p>Open the right Zena tool directly.</p></div><button class="icon close-modal" aria-label="Close"><i data-lucide="x"></i></button></div>${content}</aside>`;
      const close=()=>{$('#modalRoot').innerHTML='';$('#create').classList.remove('open-state')};
      $('.scrim').onclick=$('.close-modal').onclick=close;
      document.querySelectorAll('.create-option').forEach(b=>b.onclick=()=>{close();start(b.dataset.name)});icons()
    }
    function openZenaTools(){
      const option=a=>`<button class="create-option" data-name="${a[0]}"><span class="tool-icon ${a[3]}"><i data-lucide="${a[2]}"></i></span><span><strong>${a[0]}</strong><small>${a[1]}</small></span><i data-lucide="chevron-right"></i></button>`;
      const mainApps=apps.slice(0,6), notes=apps[6];
      $('#zenaApps').classList.add('drawer-open');
      $('#modalRoot').innerHTML=`<button class="scrim" aria-label="Close ZenaTools"></button><section class="modal apps-modal" role="dialog" aria-modal="true" aria-labelledby="appsTitle"><div class="modal-head apps-modal-head"><div class="apps-title-copy"><h2 id="appsTitle">ZenaTools</h2><p>Choose a tool or explore more products.</p></div><button class="apps-close close-modal" aria-label="Close"><i data-lucide="x"></i></button></div><div class="apps-grid">${mainApps.map(option).join('')}<div class="apps-bottom-row">${option(notes)}<div class="marketplace-card"><span class="marketplace-logo" aria-hidden="true"><i data-lucide="store"></i></span><span class="marketplace-copy"><strong>Marketplace</strong><small>Discover more Zoo Office products</small></span><button class="marketplace-button" id="openMarketplace">Open</button></div></div></div></section>`;
      const close=()=>{$('#modalRoot').innerHTML='';$('#zenaApps').classList.remove('drawer-open')};
      $('.scrim').onclick=$('.close-modal').onclick=close;
      document.querySelectorAll('.create-option').forEach(b=>b.onclick=()=>{close();start(b.dataset.name)});
      $('#openMarketplace').onclick=e=>{e.stopPropagation();close();start('Marketplace')};
      icons()
    }
    $('#collapse').onclick=()=>{sidebar.classList.add('collapsed');icons()};$('#brandButton').onclick=()=>{if(sidebar.classList.contains('collapsed'))sidebar.classList.remove('collapsed');else showNewChat()};$('#create').onclick=showNewChat;$('#theme').onclick=()=>{const dark=root.dataset.theme!=='dark';root.dataset.theme=dark?'dark':'light';$('#theme').innerHTML=`<i data-lucide="${dark?'sun':'moon'}"></i><span>${dark?'Light':'Dark'} mode</span>`;icons()};$('#searchHistory').onclick=showSearchPage;$('#zenaApps').onclick=openZenaTools;$('#marketplace').onclick=()=>start('Marketplace');$('#openNav').onclick=()=>sidebar.classList.add('open');$('#closeNav').onclick=()=>sidebar.classList.remove('open');document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='n'&&!/input|textarea/i.test(e.target.tagName)){e.preventDefault();showNewChat()}if(e.key==='Escape'){$('#modalRoot').innerHTML='';$('#zenaApps').classList.remove('drawer-open');sidebar.classList.remove('open')}});
    $('#recentsDropdownToggle')?.addEventListener('click',()=>{
      const section=$('#sidebarHistory');
      const btn=$('#recentsDropdownToggle');
      const expanded=btn.getAttribute('aria-expanded')==='true';
      btn.setAttribute('aria-expanded',String(!expanded));
      section.classList.toggle('recents-collapsed',expanded);
    });

    $('#bookmarkFilter')?.addEventListener('click',()=>{
      bookmarksOnly=!bookmarksOnly;
      const btn=$('#bookmarkFilter');
      btn.classList.toggle('active',bookmarksOnly);
      btn.setAttribute('aria-pressed',String(bookmarksOnly));
      renderHistory();
    });

                </label>
                <label class="settings-field">
                  <span class="settings-field-label">About you</span>
                  <textarea rows="4" placeholder="Tell Zoo Office a little about you"></textarea>
                </label>
                <div class="settings-field traits-field">
                  <span class="settings-field-label">What traits should Zoo Office have?</span>
                  <div class="traits-selected">No traits selected</div>
                  <div class="traits-list">
                    <button type="button" class="trait-chip">+ Chatty</button>
                    <button type="button" class="trait-chip">+ Witty</button>
                    <button type="button" class="trait-chip">+ Straight Shooting</button>
                    <button type="button" class="trait-chip">+ Encouraging</button>
                    <button type="button" class="trait-chip">+ Gen Z</button>
                    <button type="button" class="trait-chip">+ Skeptical</button>
                    <button type="button" class="trait-chip">+ Traditional</button>
                    <button type="button" class="trait-chip">+ Forward Thinking</button>
                    <button type="button" class="trait-chip">+ Poetic</button>
                  </div>
                </div>
                <label class="settings-field">
                  <span class="settings-field-label">Custom instructions for Zoo Office</span>
                  <textarea rows="6" placeholder="Custom instructions for Zoo Office"></textarea>
                </label>
              </div>
            </div>

            <div class="settings-panel" data-settings-panel="account">
              <div class="settings-content-head"><h3>Account</h3></div>
              <div class="account-edit-section">
                <div class="account-edit-head">
                  <div>
                    <strong>Account information</strong>
                    <small>Manage your name and email address.</small>
                  </div>
                  <button type="button" class="settings-secondary account-manage-btn">Manage</button>
                </div>

                <label class="settings-field">
                  <span class="settings-field-label">Name</span>
                  <input class="account-edit-input" type="text" value="Riya Yallabandi" disabled>
                </label>

                <label class="settings-field">
                  <span class="settings-field-label">Email</span>
                  <input class="account-edit-input" type="email" value="riya@example.com" disabled>
                </label>
              </div>
            </div>
          <div class="settings-panel" data-settings-panel="usage">
              <div class="settings-content-head">
                <h3>Usage</h3>
              </div>

              <div class="usage-content">
                <div class="usage-plan-row">
                  <strong>Current Plan</strong>
                  <span class="usage-plan-pill">Free</span>
                </div>

                <div class="usage-divider"></div>

                <div class="usage-metric">
                  <div class="usage-metric-head">
                    <span>AI Credits</span>
                    <span>0 / 1,000</span>
                  </div>
                  <div class="usage-progress"><span style="width:0%"></span></div>
                </div>

                <div class="usage-metric">
                  <div class="usage-metric-head">
                    <span>ZooDrive Storage</span>
                    <span>0 B / 1.00 GB</span>
                  </div>
                  <div class="usage-progress"><span style="width:0%"></span></div>
                </div>

                <div class="usage-metric">
                  <div class="usage-metric-head">
                    <span>Files Uploaded</span>
                    <span>0</span>
                  </div>
                </div>

                <div class="usage-upgrade-card">
                  <h4>Unlock more with Starter</h4>
                  <ul>
                    <li>10,000 credits/month</li>
                    <li>All SOTA AI Models</li>
                    <li>Professional Workspace</li>
                    <li>5 GB ZooDrive storage</li>
                    <li>Commercial use</li>
                  </ul>
                  <button type="button" class="usage-upgrade-btn">Upgrade Now</button>
                </div>
              </div>
            </div>

            <div class="settings-panel" data-settings-panel="billing">
              <div class="settings-content-head">
                <h3>Billing</h3>
              </div>

              <div class="billing-content">
                <div class="billing-row">
                  <div>
                    <strong>Zoo Office Starter</strong>
                    <small>Your plan auto-renews on Oct 3, 2026</small>
                  </div>
                  <button type="button" class="billing-manage-btn">Manage</button>
                </div>

                <div class="billing-divider"></div>

                <div class="billing-row">
                  <div>
                    <strong>Cancel plan</strong>
                    <small>If you cancel, you'll keep full access to your Zoo Office plan features until the end of your billing period.</small>
                  </div>
                  <button type="button" class="billing-cancel-btn">Cancel</button>
                </div>
              </div>
            </div>
          </div>
          <div class="settings-save-bar">
            <button type="button" class="settings-save-btn">Save</button>
          </div>
        </section>`;

      const close=()=>{$('#modalRoot').innerHTML=''};
      $('.settings-scrim').onclick=close;
      $('.settings-close').onclick=close;
      document.querySelectorAll('.settings-nav-item').forEach(btn=>{
        btn.onclick=()=>{
          const tab=btn.dataset.settingsTab;
          document.querySelectorAll('.settings-nav-item').forEach(x=>x.classList.toggle('active',x===btn));
          document.querySelectorAll('.settings-panel').forEach(p=>p.classList.toggle('active',p.dataset.settingsPanel===tab));
        };
      });
      const appearanceTrigger=$('.appearance-trigger');
      const appearanceMenu=$('.appearance-menu');
      if(appearanceTrigger && appearanceMenu){
        appearanceTrigger.onclick=e=>{
          e.stopPropagation();
          const open=appearanceTrigger.getAttribute('aria-expanded')==='true';
          appearanceTrigger.setAttribute('aria-expanded',String(!open));
          appearanceMenu.classList.toggle('open',!open);
        };
        appearanceMenu.querySelectorAll('[data-appearance]').forEach(btn=>{
          btn.onclick=e=>{
            e.stopPropagation();
            $('.appearance-value').textContent=btn.textContent;
            appearanceTrigger.setAttribute('aria-expanded','false');
            appearanceMenu.classList.remove('open');
          };
        });
      }
      document.querySelectorAll('.trait-chip').forEach(chip=>{
        chip.onclick=()=>{
          chip.classList.toggle('selected');
          const selected=[...document.querySelectorAll('.trait-chip.selected')].map(x=>x.textContent.replace(/^\\+\\s*/,''));
          $('.traits-selected').textContent=selected.length?selected.join(', '):'No traits selected';
        };
      });
      icons();
    }
    function closeProfileMenu(){
      const menu=document.querySelector('.profile-popover');
      if(menu)menu.remove();
      $('#profileMenuButton')?.setAttribute('aria-expanded','false');
    }

    function openProfileMenu(){
      closeProfileMenu();
      const anchor=$('#profileMenuButton');
      if(!anchor)return;
      const r=anchor.getBoundingClientRect();
      const menu=document.createElement('div');
      menu.className='profile-popover';
      menu.setAttribute('role','menu');
      menu.innerHTML=`
        <div class="profile-popover-head">
          <span class="profile-popover-avatar">RY</span>
          <span class="profile-popover-user">
            <strong>Riya Yallabandi</strong>
            <small>34,441 credits</small>
          </span>
        </div>
        <div class="profile-popover-divider"></div>
        <button role="menuitem" data-profile-action="upgrade">
          <i data-lucide="sparkles"></i>
          <span>Upgrade plan</span>
        </button>
        <button role="menuitem" data-profile-action="settings">
          <i data-lucide="settings"></i>
          <span>Settings</span>
        </button>
        <div class="profile-help-wrap">
          <button role="menuitem" class="profile-help-trigger" data-profile-action="help">
            <i data-lucide="circle-help"></i>
            <span>Help</span>
            <i class="profile-help-arrow" data-lucide="chevron-right"></i>
          </button>
          <div class="profile-help-submenu" role="menu" aria-label="Help">
            <button role="menuitem" data-help-action="help-center"><i data-lucide="circle-help"></i><span>Help Center</span></button>
            <button role="menuitem" data-help-action="terms"><i data-lucide="file-text"></i><span>Terms</span></button>
            <button role="menuitem" data-help-action="privacy"><i data-lucide="shield-check"></i><span>Privacy Policy</span></button>
            <button role="menuitem" data-help-action="bug"><i data-lucide="bug"></i><span>Report Bug</span></button>
            <button role="menuitem" data-help-action="about"><i data-lucide="user-round"></i><span>About Us</span></button>
          </div>
        </div>
        <div class="profile-popover-divider"></div>
        <button role="menuitem" data-profile-action="logout">
          <i data-lucide="log-out"></i>
          <span>Log out</span>
        </button>`;
      document.body.appendChild(menu);

      const width=224;
      const gap=8;

      /* Keep the profile/settings popup inside and above the sidebar */
      const sidebar=anchor.closest('.sidebar');
      const sr=sidebar ? sidebar.getBoundingClientRect() : r;

      let left=sr.left + Math.max(8,(sr.width-width)/2);
      left=Math.max(8,Math.min(left,window.innerWidth-width-8));

      let top=r.top-menu.offsetHeight-gap;
      top=Math.max(8,top);

      menu.style.left=left+'px';
      menu.style.top=top+'px';

      menu.querySelectorAll(':scope > button, .profile-popover > button').forEach(btn=>{
        btn.onclick=e=>{
          e.stopPropagation();
          const action=btn.dataset.profileAction;
          if(action==='upgrade'){closeProfileMenu();openUpgradePlan();}
          if(action==='settings'){closeProfileMenu();openSettingsModal();}
          if(action==='logout'){closeProfileMenu();start('Log out');}
        };
      });

      menu.querySelectorAll('[data-help-action]').forEach(btn=>{
        btn.onclick=e=>{
          e.stopPropagation();
          const labels={
            'help-center':'Help Center',
            'terms':'Terms',
            'privacy':'Privacy Policy',
            'bug':'Report Bug',
            'about':'About Us'
          };
          closeProfileMenu();
          start(labels[btn.dataset.helpAction] || 'Help');
        };
      });

      anchor.setAttribute('aria-expanded','true');
      icons();
    }

    $('#profileMenuButton')?.addEventListener('click',e=>{
      e.stopPropagation();
      const open=document.querySelector('.profile-popover');
      open?closeProfileMenu():openProfileMenu();
    });

    document.addEventListener('click',e=>{
      if(!e.target.closest('.profile-popover')&&!e.target.closest('#profileMenuButton'))closeProfileMenu();
    });

    renderHistory();renderTools();icons();
  </script>

<script>
document.addEventListener('click', function (event) {
  const manageButton = event.target.closest('.account-manage-btn');
  if (!manageButton) return;

  event.preventDefault();

  const accountPanel = manageButton.closest('[data-settings-panel="account"]');
  if (!accountPanel) return;

  const inputs = accountPanel.querySelectorAll('.account-edit-input');
  const shouldEnable = Array.from(inputs).some(input => input.disabled);

  inputs.forEach(input => {
    input.disabled = !shouldEnable;
    input.readOnly = false;
  });

  manageButton.textContent = shouldEnable ? 'Done' : 'Manage';
  manageButton.classList.toggle('is-editing', shouldEnable);

  if (shouldEnable && inputs.length) {
    inputs[0].focus();
  }
});
</script>


<script>
document.addEventListener('click', function(event) {
  const manageButton = event.target.closest('.billing-manage-btn');
  if (!manageButton) return;

  event.preventDefault();
  event.stopImmediatePropagation();

  const modalRoot = document.querySelector('#modalRoot');
  if (modalRoot) modalRoot.innerHTML = '';

  openUpgradePlan();
}, true);
</script>
